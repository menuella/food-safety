name: Release (RubyGems)

# Its own workflow, like npm, NuGet, pub.dev, PyPI and crates.io. One tag ships
# them all, but the OIDC exchanges are independent — a policy problem on one
# registry must not take the others down with it.
#
# RubyGems supports PENDING trusted publishers, so — unlike crates.io, which can
# only bind a publisher to a crate that already exists — this workflow creates
# the gem itself on its first successful run. There is no manual first push, and
# no long-lived API key is ever issued. The pending publisher becomes a normal
# one at that point, and the configuring account becomes an owner.
#
# The `environment:` name below is part of the OIDC claim RubyGems checks. It
# must match the Environment field on the trusted publisher exactly, or the
# exchange is rejected — the failure reads like a permissions problem rather
# than a typo, so it is worth getting right the first time.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-rubygems
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: rubygems
      url: https://rubygems.org/gems/menuella-food_safety
    permissions:
      contents: read
      # Trusted Publishing: RubyGems.org exchanges this OIDC token for a
      # short-lived API key. No RUBYGEMS_API_KEY exists anywhere.
      id-token: write
    defaults:
      run:
        working-directory: packages/ruby

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: packages/ruby

      # The tag is the source of truth. A mismatch means someone tagged without
      # bumping, and the published version would lie about which data it holds.
      #
      # Checked before the credential is minted: RubyGems only allows a yank
      # within 72 hours of a push, and a yanked version's number can never be
      # reused.
      - name: Check tag matches the gem version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gem_version="$(ruby -r ./lib/menuella/food_safety/version -e 'print Menuella::FoodSafety::VERSION')"
          if [ "$tag" != "$gem_version" ]; then
            echo "::error::tag v$tag does not match the gem version $gem_version"
            exit 1
          fi

      # Everything the verify workflow runs, once more against the exact commit
      # being published. Cheap next to an unpublishable mistake.
      - run: bundle exec rake test
      - run: gem build menuella-food_safety.gemspec

      # The primitive rather than the `rubygems/release-gem` wrapper, which
      # builds and pushes for you. Doing it in steps keeps the tag check and the
      # already-published probe below, and keeps the job at `contents: read` —
      # the wrapper wants `contents: write` so it can push a git tag, which this
      # workflow does not need because the tag is what triggered it.
      # Pinned to an exact version because this action publishes no floating
      # major tag — `@v1` and `@v2` do not resolve, which is how the first
      # v1.3.0 attempt failed. Bump deliberately.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # `gem push` fails on a version already on RubyGems, which makes a re-run
      # of an otherwise-finished release go red. Ask first — the registry is the
      # authority on what has shipped, not the workflow's memory of it.
      - name: Publish
        run: |
          version="$(ruby -r ./lib/menuella/food_safety/version -e 'print Menuella::FoodSafety::VERSION')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/menuella-food_safety/versions/${version}.json" || true)"
          if [ "$status" = "200" ]; then
            echo "menuella-food_safety $version is already on RubyGems — nothing to do"
            exit 0
          fi
          gem push "menuella-food_safety-${version}.gem"
