name: Tag (Go module)

# The Go module is NESTED, so the Go proxy only sees a release tagged with its
# directory prefix — `packages/go/v<version>`, not `v<version>`. Creating that by hand
# every release is a step that gets forgotten, and the failure is silent: the
# other six registries publish, and Go simply stays on the previous version.
#
# So the prefixed tag is derived from the plain one, on push, automatically.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Created through the REST API rather than `git push`, which GitHub
      # rejects:
      #
      #   refusing to allow a GitHub App to create or update workflow
      #   `.github/workflows/tag-go-module.yml` without `workflows` permission
      #
      # Pushing a NEW ref makes every workflow file under it reachable, which
      # GitHub treats as creating them — and `workflows: write` cannot be
      # granted through a job's `permissions:` block at all. Only a PAT or a
      # GitHub App can hold it, and storing one here would put a long-lived
      # credential in a repository that otherwise has none.
      #
      # The API sidesteps it honestly rather than by escalation: the commit is
      # already on the remote, so pointing a ref at it uploads no objects and
      # the check never applies. `contents: write` is enough.
      - name: Create the module-prefixed tag on the same commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefixed="packages/go/${GITHUB_REF_NAME}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${prefixed}" >/dev/null 2>&1; then
            echo "::notice::${prefixed} already exists — nothing to do"
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${prefixed}" \
            -f sha="${GITHUB_SHA}" >/dev/null
          echo "::notice::created ${prefixed}"

      # Asking the proxy for the version is what makes it fetch and cache the
      # module; pkg.go.dev then picks it up from there. Without this the first
      # `go get` is the thing that triggers indexing, so the package page sits
      # empty until someone happens to install it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"

      - name: Ask the Go proxy to index it
        run: |
          version="${GITHUB_REF_NAME}"
          GOPROXY=https://proxy.golang.org GONOSUMDB="" \
            go list -m "github.com/menuella/food-safety/packages/go@${version}" || \
            echo "::notice::proxy has not seen the tag yet; it will index on first fetch"
