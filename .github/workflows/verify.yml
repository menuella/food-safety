name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only ever read the checkout.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Schemas, key integrity, icon coverage, footnote codes, and that the
      # generated files still match their sources.
      - run: npm run verify

      # Runtime behaviour of the published entry point: immutability, guards,
      # error contracts.
      - run: npm test

      # A dependency with a known high-severity advisory should not reach a
      # release. One devDependency today, so this is cheap insurance.
      - run: npm audit --audit-level=high

  dart:
    name: Dart package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      # `dart analyze` at default severity: the package sets strict-casts,
      # strict-inference and public_member_api_docs, so an undocumented public
      # member fails here rather than silently costing pub.dev score points.
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart test

      # Catches the mistake that would otherwise reach pub.dev: a package that
      # builds locally but is missing a file, or trips a publish-time check.
      - run: dart pub publish --dry-run

  python:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip build pytest jsonschema twine
          python -m pip install -e .

      # The tests that matter here compare the PACKAGED copy of the dataset
      # against the canonical data/ at the repo root. A wheel built without
      # running the generator would otherwise ship stale data and pass
      # everything else.
      - run: python -m pytest -q

      - run: python -m build
      - run: python -m twine check dist/*

  jvm:
    name: JVM package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      # `build` covers compile, explicitApi, tests, and the sources and javadoc
      # jars Maven Central requires — so a missing artifact fails here rather
      # than at upload, where Central has no unpublish to fall back on.
      - run: ./gradlew build --console=plain

      # The POM is what Central validates hardest. Generating it in CI means a
      # missing licence, developer or scm block is caught on the PR.
      - run: ./gradlew generatePomFileForMavenPublication --console=plain

  php:
    name: PHP package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: json
          coverage: none

      # --strict catches metadata Packagist would accept but render poorly.
      - run: composer validate --strict --no-check-all
      - run: composer install --no-interaction --no-progress

      # The tests that matter here compare the PACKAGED copy of the dataset
      # against the canonical data/. A release built without running the
      # generator would otherwise ship stale data and pass everything else.
      - run: ./vendor/bin/phpunit -c packages/php/phpunit.xml

  swift:
    name: Swift package
    # macOS, not ubuntu: the package declares Apple platforms, and Bundle.module
    # resource lookup is what these tests exercise.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build --configuration release

      # The tests compare the packaged resources against the canonical data/,
      # so a release built without running the generator fails here rather than
      # shipping stale data with everything else green.
      - run: swift test

  go:
    name: Go module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: packages/go/go.sum

      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...

      # The tests compare the EMBEDDED dataset against the canonical data/, so
      # a release built without running the generator fails here rather than
      # shipping stale data with everything else green.
      - run: go test ./...

  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust

      # src/generated.rs is emitted by scripts/generate.mjs and formatted by it,
      # so a diff here means the generator's output and the committed file have
      # parted ways.
      - run: cargo fmt --check

      # The manifest denies all of clippy::all and warns on pedantic. --all-targets
      # covers the tests too, and -D warnings makes pedantic fail the build.
      - run: cargo clippy --all-targets --all-features -- -D warnings

      # Both feature configurations: `serde` adds derives to every public type,
      # and default-off is what most consumers get.
      #
      # The tests compare the GENERATED SOURCE against the canonical data/, so a
      # release cut without running the generator fails here rather than shipping
      # stale disclosures with everything else green.
      - run: cargo test --no-default-features
      - run: cargo test --all-features

      # Builds the exact tarball `cargo publish` would upload, so an `include`
      # list that omits something the crate needs fails here rather than at
      # release time — when crates.io has no unpublish.
      - run: cargo package

  ruby:
    name: Ruby gem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/ruby
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest the gemspec claims to support. Without the
        # lower bound, `required_ruby_version >= 3.2` would be an assertion
        # nobody had tested.
        ruby: ["3.2", "3.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby

      # The tests that matter here compare the PACKAGED copy of the dataset
      # against the canonical data/. A gem built without running the generator
      # would otherwise ship stale data and pass everything else. Warnings are
      # on, so Ruby's own diagnostics surface too.
      - run: bundle exec rake test

      # Builds the exact .gem `gem push` would upload, so a `files` list that
      # omits something the gem needs fails here rather than at release time —
      # when RubyGems has no unpublish beyond a 72-hour window.
      - run: gem build menuella-food_safety.gemspec

  dotnet:
    name: .NET package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The one binding that had no gate: release-nuget.yml is behind
      # `vars.NUGET_ENABLED`, which is unset, so until now the C# never compiled
      # in CI at all. Directory.Build.props sets TreatWarningsAsErrors, so this
      # covers nullability and code style as well as the tests — and those tests
      # are the ones that read data/ from the repo root, catching an embedded
      # resource that has gone stale against the canonical JSON.
      - run: dotnet test -c Release --nologo

      # Builds the exact .nupkg `dotnet nuget push` would upload, so a missing
      # README, icon or embedded data file fails here rather than at release
      # time — nuget.org has no unpublish, only unlist.
      - run: dotnet pack -c Release --nologo -o "${RUNNER_TEMP}/nupkg"
